    <style>
      /* Boot and platform rules (audit Phase F). Kept here so they apply with the first paint.
         1. The Urdu font file (233 KB) is only fetched once Urdu is the game's language: main.js then puts
            "urdu-font" on <html>. Until then Urdu text (the two-language loading screen, the language buttons)
            uses the device's own Arabic-script font. */
      :root:not(.urdu-font) { --urdu: system-ui, "Segoe UI", "Geeza Pro", "Noto Naskh Arabic", serif; }
      /* 2. A game surface, not a document: no text selection, no long-press menu, no double-tap zoom, no pull to
            refresh or scroll chaining. Lists that scroll (map, guide, settings) still scroll. */
      html, body { overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } /* inherited by every element */
      /* 3. A picture that could not be loaded (ui/pic-retry.js): a plain tile, and its caption always shows. */
      .pic.pic-missing { background: #e3d5bb66; border-radius: 12px; box-shadow: inset 0 0 0 2px #e3d5bb; }
      .pic.pic-missing .pic-img { visibility: hidden; }
      body.nocap .pic.pic-missing ~ .cap { visibility: visible !important; }
    </style>
